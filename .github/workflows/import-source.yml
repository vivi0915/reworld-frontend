name: Sync validated Reworld update
on: workflow_dispatch
permissions:
  contents: write
concurrency: reworld-source-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply reviewed source update
        run: |
          echo '37727873bb86e190fb6f084661e6b3c002db0f92c0d6f48011088752fca6043a  reworld-update.patch' | sha256sum -c -
          git apply --check reworld-update.patch
          git apply --index reworld-update.patch
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Save verified source
        run: |
          git rm reworld-update.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Guest, Player, secure Access and operations dashboard'
          git push origin HEAD:main
